server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: product-service
          # When running in k8s, product-service is the DNS name of the service
          uri: http://product-service:8081
          predicates:
            - Path=/api/products/**
        - id: order-service
          uri: http://order-service:8082
          predicates:
            - Path=/api/cart/**, /api/checkout/**
        - id: user-service
          uri: http://user-service:8083
          predicates:
            - Path=/api/users/**
        - id: payment-service
          uri: http://payment-service:8084
          predicates:
            - Path=/api/payment/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health
