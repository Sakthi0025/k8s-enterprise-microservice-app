server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Support client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API endpoints are managed by the main Traefik Ingress. 
    # The frontend pod only needs to serve the static bundle.
}
